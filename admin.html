<!doctype html><html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>MC Control - Rung Chuông Vàng</title><link rel="stylesheet" href="admin.css"></head><body><header><b>THPT LÊ DUẨN • MC CONTROL</b><span id="status">OFFLINE</span></header><main><section id="login" class="card"><h1>BẢNG ĐIỀU KHIỂN MC</h1><input id="key" type="password" placeholder="Admin Key"><button onclick="login()">ĐĂNG NHẬP</button><p id="msg"></p></section><section id="panel" class="hidden"><div class="grid"><div class="card"><small>CÂU</small><strong id="qno">0/40</strong><em id="clock">--</em></div><div class="card"><small>CÒN LẠI</small><strong id="alive">0</strong></div><div class="card"><small>ĐÃ TRẢ LỜI</small><strong id="answered">0</strong></div></div><div class="card question"><small>CÂU HỎI</small><h2 id="question">Chưa bắt đầu</h2><div id="opts"></div></div><div class="controls"><button onclick="act('start')">▶ BẮT ĐẦU</button><button onclick="act('next')">NEXT →</button><button onclick="act('pause')">Ⅱ TẠM DỪNG</button><button class="danger" onclick="act('finish')">■ KẾT THÚC</button><button class="danger" onclick="resetGame()">↺ RESET</button></div><div class="card"><h2>BẢNG XẾP HẠNG</h2><table><thead><tr><th>#</th><th>Họ tên</th><th>Lớp</th><th>Điểm</th><th>Đúng</th><th>Trạng thái</th></tr></thead><tbody id="rows"></tbody></table></div></section></main><script>const API='PASTE_APPS_SCRIPT_WEB_APP_URL_HERE';let KEY='';function api(a,p={}){return new Promise((ok,no)=>{const c='m_'+Date.now(),s=document.createElement('script');window[c]=x=>{delete window[c];s.remove();x.success?ok(x):no(Error(x.error||'Lỗi'))};s.onerror=()=>no(Error('Mất kết nối'));s.src=API+'?'+new URLSearchParams({action:a,callback:c,...p});document.body.appendChild(s)})}async function login(){KEY=document.getElementById('key').value;try{const x=await api('adminState',{adminKey:KEY});document.getElementById('login').classList.add('hidden');document.getElementById('panel').classList.remove('hidden');render(x);refresh();setInterval(refresh,1200);setInterval(results,4000)}catch(e){document.getElementById('msg').textContent=e.message}}async function refresh(){try{render(await api('adminState',{adminKey:KEY}))}catch(e){}}async function act(a){try{render(await api(a,{adminKey:KEY}));results()}catch(e){alert(e.message)}}async function results(){try{const x=await api('results');document.getElementById('rows').innerHTML=x.results.map(r=>`<tr><td>${r.rank}</td><td>${esc(r.fullName)}</td><td>${esc(r.className)}</td><td>${r.score}</td><td>${r.correct}</td><td>${r.status}</td></tr>`).join('')}catch(e){}}function render(x){const g=x.game;document.getElementById('status').textContent=g.status;document.getElementById('qno').textContent=g.currentQuestion+'/'+g.totalQuestions;document.getElementById('alive').textContent=g.aliveCount;document.getElementById('answered').textContent=g.answeredCount;document.getElementById('question').textContent=x.question?x.question.question:'Chưa bắt đầu';document.getElementById('opts').innerHTML=x.question?Object.entries(x.question.options).map(([k,v])=>`<p><b>${k}</b> ${esc(v)}</p>`).join(''):'';clearInterval(window.tc);if(g.status==='RUNNING'&&g.endsAt){window.tc=setInterval(()=>document.getElementById('clock').textContent=Math.max(0,Math.ceil((g.endsAt-Date.now())/1000)),100)}}function resetGame(){if(confirm('RESET sẽ xóa Answers của phiên. Bạn chắc chắn?'))act('reset')}function esc(s){return String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}</script></body></html>
